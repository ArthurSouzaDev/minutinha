# Lint e testes a cada push nas branches permanentes e em todo pull request.
# Documentação: docs/desenvolvimento/ci.md
name: CI

on:
  push:
    branches: [main, homologacao, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo PR/branch cancela a execução anterior (economiza minutos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check . --output-format=github

      - name: ruff format --check
        run: uv run ruff format --check .

  testes:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          # versão mínima suportada (requires-python >= 3.11)
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Instalar dependências
        run: uv sync --locked

      - name: pytest (sem testes lentos)
        run: uv run pytest -m "not lento"
